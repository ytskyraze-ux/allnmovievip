 CFG={name:v('s_name'),tagline:v('s_tl'),heading:v('s_head'),tags:v('s_tags'),perPage:+v('s_per')||10,prev:v('s_prev'),next:v('s_next'),dlText:v('s_dl'),watchText:v('s_watch'),c1:v('s_c1'),c2:v('s_c2'),showSearch:$('s_search').checked,showCats:$('s_showcats').checked,showTags:$('s_showtags').checked,showDemo:$('s_demo').checked,cats:cats,footer:v('s_foot')};

function bk(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({cfg:CFG,movies:MOVIES})],{type:'application/json'}));a.download='site-backup.json';a.click()}
function rs(i){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);CFG=Object.assign({},DEF,d.cfg);MOVIES=d.movies||[];S('anmv_cfg',CFG);S('anmv_movies',MOVIES);draw();alert('Restore ho gaya')}catch(e){alert('File galat hai')}};r.readAsText(i.files[0])}
